name: Setup app
description: pnpm と Node をセットアップして app/ の依存をインストールする
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: app/pnpm-lock.yaml
    - name: Install
      shell: bash
      working-directory: app
      run: pnpm install --frozen-lockfile
